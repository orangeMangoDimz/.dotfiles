#
# name "Fast"
# credit https://github.com/mylinuxforwork/dotfiles

animations {
    # Moderate liquid-glass motion profile.
    # Fullscreen windows are excluded by a no_anim window rule.
    enabled = true
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92 
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = liquid, 0.23, 1, 0.32, 1        # smooth glass ease-out
    bezier = glassPop, 0.17, 0.89, 0.32, 1.02  # soft glass materialize + tiny settle

    # --- original "Fast" (commented) ---
    # animation = windows, 1, 3, md3_decel, popin 60%
    # animation = fade, 1, 2.5, md3_decel
    # animation = workspaces, 1, 3.5, easeOutExpo, slide
    # animation = specialWorkspace, 1, 3, md3_decel, slidevert

    # --- moderate liquid glass: fluid, eased, and easy to follow ---
    # Windows: materialize on open, soften on close, and glide while moving.
    animation = windows, 1, 3, liquid, popin 90%
    animation = windowsIn, 1, 3, glassPop, popin 90%
    animation = windowsOut, 1, 2.5, liquid, popin 90%
    animation = windowsMove, 1, 3, liquid

    # Focus changes: animate opacity/shadows without making app switching laggy.
    animation = fade, 1, 3, liquid
    animation = fadeIn, 1, 3, liquid
    animation = fadeOut, 1, 2.5, liquid
    animation = fadeSwitch, 1, 2.5, liquid
    animation = fadeShadow, 1, 3, liquid
    animation = fadeDim, 1, 2.5, liquid

    # Subtle active-border transition; avoid borderangle loop to save battery.
    animation = border, 1, 3, liquid

    # Workspace and special-workspace movement.
    animation = workspaces, 1, 4, easeOutExpo, slidefade 12%
    animation = specialWorkspace, 1, 3, liquid, slidefadevert 12%

    # Layer-shell surfaces such as Rofi and Waybar.
    animation = layers, 1, 3, liquid, fade
    animation = layersIn, 1, 3, glassPop, slide
    animation = layersOut, 1, 2.5, liquid, slide
    animation = fadeLayers, 1, 2.5, liquid
    animation = fadeLayersIn, 1, 2.5, liquid
    animation = fadeLayersOut, 1, 2, liquid
}
